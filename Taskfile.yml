version: '3'

tasks:

  BaseAdvancedExample:
    desc: "Base: Advanced example"
    silent: true
    dir: "./GenericMCPServer/Other/Reference/ReferenceContent/Examples/AdvancedDockerComposeFile"
    cmds:
      - "python StartExample.py {{.CLI_ARGS}}"
    aliases:
      - baseadvancedexample
      - bae

  BaseAdvancedExampleTerminate:
    desc: "Base: Advanced example terminate"
    silent: true
    dir: "./GenericMCPServer/Other/Reference/ReferenceContent/Examples/AdvancedDockerComposeFile"
    cmds:
      - "python StopExample.py {{.CLI_ARGS}}"
    aliases:
      - baseadvancedexampleterminate
      - baet

  BaseBuildAllCodeunits:
    desc: "Base: Build all codeunits"
    silent: true
    dir: "."
    cmds:
      - "scbuildcodeunits {{.CLI_ARGS}}"
    aliases:
      - basebuildallcodeunits
      - bb

  BaseMinimalExample:
    desc: "Base: Minimal example"
    silent: true
    dir: "./GenericMCPServer/Other/Reference/ReferenceContent/Examples/MinimalDockerComposeFile"
    cmds:
      - "python StartExample.py {{.CLI_ARGS}}"
    aliases:
      - baseminimalexample
      - bma

  BaseMinimalExampleTerminate:
    desc: "Base: Minimal example terminate"
    silent: true
    dir: "./GenericMCPServer/Other/Reference/ReferenceContent/Examples/MinimalDockerComposeFile"
    cmds:
      - "python StopExample.py {{.CLI_ARGS}}"
    aliases:
      - baseminimalexampleterminate
      - bmat
